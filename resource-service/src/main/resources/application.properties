spring.application.name=resource-service
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Song Service Communication
song.service.base-url=${SONG_SERVICE_BASE_URL:http://localhost:8081}
song.service.metadata-endpoint=/songs

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
