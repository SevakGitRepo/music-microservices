spring.application.name=resource-service
server.port=8080

song.service.base-url=http://song-service:8081
song.service.metadata-endpoint=/songs

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://resource-postgres:5432/resource_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
