spring.application.name=resource-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

song.service.base-url=${SONG_SERVICE_BASE_URL:http://localhost:8080}
song.service.metadata-endpoint=${SONG_SERVICE_METADATA_ENDPOINT:/song-service/songs}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
