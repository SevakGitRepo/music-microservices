spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=resource-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://resource-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/resource-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/resource-service/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[1].id=song-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://song-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/song-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/song-service/(?<segment>.*), /${segment}
